[package]
name = "blink-settings"
description = "Blink settings: a Tauri window that runs only while it is open and talks to the notch over its pipe"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "blink-settings"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
# What `tauri build` turns on: serve the embedded pages instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blink-core = { path = "../blink-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"]
