[package]
name = "native-notch-spike"
version = "0.0.1"
edition = "2021"
description = "Throwaway spike: a native (no web engine) notch to compare against the WebView2 app"
publish = false

[dependencies]
tiny-skia = "0.11"
ttf-parser = "0.25"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
